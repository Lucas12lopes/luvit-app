<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luvit Pro - Rota Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LU<span>VI</span>T</h1>
        <div id="labelCidade" class="label-cidade">📍 São José dos Pinhais</div>
    </header>

    <nav class="abas">
        <button class="aba ativa" data-aba="entregas">📦 ENTREGAS</button>
        <button class="aba" data-aba="favoritos">★ FAVORITOS</button>
    </nav>

    <main>
        <section id="aba-entregas" class="aba-content ativa">
            <div class="topo-entregas">
                <p id="contador">0 entregas</p>
                <div class="topo-btns">
                    <button id="btnLimpar">🗑 Limpar</button>
                    <button id="btnOtimizar">⚡ Otimizar Rota</button>
                </div>
            </div>
            <div class="input-wrapper">
                <div class="input-area">
                    <input type="text" id="enderecoInput" placeholder="Rua e número..." autocomplete="off">
                    <button id="btnAdicionar">+ Add</button>
                </div>
                <div id="sugestoes" class="sugestoes-box" style="display:none"></div>
            </div>
            <ul id="listaEntregas"></ul>
        </section>

        <section id="aba-favoritos" class="aba-content">
            <ul id="listaFavoritos"></ul>
        </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitulo">📍 Trajeto Real</h3>
                <button id="btnFecharModal" class="btn-fechar-x">✕</button>
            </div>
            <div id="infoRota" class="info-rota-topo"></div>
            <div id="mapContainer"></div>
            <div id="controleNavegacao"></div> 
            <div class="modal-btns" id="modalBtns"></div>
            <button id="btnCancelarModal" class="btn-voltar">Voltar à lista</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
